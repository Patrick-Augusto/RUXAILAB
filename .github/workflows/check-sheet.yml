name: Generate Check Sheet

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check sheet script
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python checksheet/checsheet.py

      - name: Commit and push CHECK_SHEET.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksheet/CHECK_SHEET.md
          git diff --cached --quiet || git commit -m "chore: update CHECK_SHEET.md [skip ci]"
          git push
